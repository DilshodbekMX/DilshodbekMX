# Renders the metrics cards the README shows (assets/metrics*.svg), committed back to main.
#
# The calendar needs no setup. The overview card counts repositories and languages across the
# account, which the automatic GITHUB_TOKEN cannot see (it is scoped to this repository alone:
# without a personal token the card reads "1 Repository, 0 Languages"). To fill it in, create a
# classic token with the `public_repo` scope at https://github.com/settings/tokens and add it as
# the repository secret METRICS_TOKEN (Settings → Secrets and variables → Actions).
name: metrics

on:
  schedule: [{ cron: '41 4 * * *' }]     # daily, 04:41 UTC
  workflow_dispatch:
  push: { branches: [main] }

jobs:
  overview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview (commits, repositories, languages, activity)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, repositories
          base_indepth: yes
          config_timezone: Asia/Tashkent
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_lines: yes
          repositories_forks: no        # only the repositories I own

      - name: Calendar (a year of contributions)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Tashkent
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
