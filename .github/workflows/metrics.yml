# Renders the metrics cards the README shows (assets/metrics*.svg), committed back to main.
# Works with the automatic GITHUB_TOKEN; no personal token is needed for these plugins.
name: metrics

on:
  schedule: [{ cron: '41 4 * * *' }]     # daily, 04:41 UTC
  workflow_dispatch:
  push: { branches: [main] }

jobs:
  overview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview (commits, repositories, languages, activity)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, repositories
          base_indepth: yes
          config_timezone: Asia/Tashkent
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_lines: yes

      - name: Calendar (a year of contributions)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Tashkent
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
