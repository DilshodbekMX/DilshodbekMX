# Draws the contribution graph as a snake game and publishes the SVGs to the `output` branch.
# The README points at raw.githubusercontent.com/.../output/... so nothing lands on main.
name: snake

on:
  schedule: [{ cron: '17 3 * * *' }]     # daily, 03:17 UTC
  workflow_dispatch:                      # run it by hand from the Actions tab
  push: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake (light and dark)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
