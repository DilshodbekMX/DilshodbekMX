<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mamadaliev Dilshodjon — cybersecurity researcher, anomaly and DDoS detection">
  <defs>
    <linearGradient id="mdx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="mdx-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa3e0" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#4aa3e0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="mdx-clip"><rect x="700" y="60" width="452" height="190" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#mdx-bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#26333c"/>

  <!-- wordmark -->
  <text x="72" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#e6edf3">Mamadaliev Dilshodjon</text>
  <text x="74" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#9fb0a8">Cybersecurity research · computer vision · developer tools</text>
  <rect x="74" y="192" width="86" height="4" rx="2" fill="#2ea36a"/>
  <text x="74" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8b9e95">c · python · typescript · yolo · django · react · docker</text>

  <!-- traffic panel: a baseline of normal traffic, then an anomaly burst that gets flagged -->
  <g clip-path="url(#mdx-clip)">
    <rect x="700" y="60" width="452" height="190" rx="12" fill="#0f161d" stroke="#26333c"/>
    <g stroke="#1b242c" stroke-width="1">
      <line x1="700" y1="108" x2="1152" y2="108"/>
      <line x1="700" y1="155" x2="1152" y2="155"/>
      <line x1="700" y1="202" x2="1152" y2="202"/>
    </g>
    <path d="M712 205 L744 198 L776 208 L808 196 L840 206 L872 199 L904 120 L920 96 L936 150 L952 201 L984 197 L1016 206 L1048 198 L1080 207 L1112 199 L1140 204"
          fill="none" stroke="url(#mdx-line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- the flagged burst -->
    <g>
      <rect x="892" y="76" width="56" height="130" rx="8" fill="#ff8a3d" fill-opacity="0.08" stroke="#ff8a3d" stroke-opacity="0.45"/>
      <circle cx="920" cy="96" r="6" fill="#ff8a3d">
        <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- packets travelling along the baseline -->
    <g fill="#4aa3e0">
      <circle r="3.5" cx="0" cy="0" opacity="0.85">
        <animateMotion dur="5.5s" repeatCount="indefinite"
          path="M712 205 L744 198 L776 208 L808 196 L840 206 L872 199 L904 120 L920 96 L936 150 L952 201 L984 197 L1016 206 L1048 198 L1080 207 L1112 199 L1140 204"/>
      </circle>
      <circle r="3.5" cx="0" cy="0" opacity="0.5">
        <animateMotion dur="5.5s" begin="1.8s" repeatCount="indefinite"
          path="M712 205 L744 198 L776 208 L808 196 L840 206 L872 199 L904 120 L920 96 L936 150 L952 201 L984 197 L1016 206 L1048 198 L1080 207 L1112 199 L1140 204"/>
      </circle>
      <circle r="3.5" cx="0" cy="0" opacity="0.3">
        <animateMotion dur="5.5s" begin="3.6s" repeatCount="indefinite"
          path="M712 205 L744 198 L776 208 L808 196 L840 206 L872 199 L904 120 L920 96 L936 150 L952 201 L984 197 L1016 206 L1048 198 L1080 207 L1112 199 L1140 204"/>
      </circle>
    </g>
  </g>
  <text x="700" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b9e95">traffic</text>
  <text x="1152" y="272" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#ff8a3d">anomaly flagged</text>
</svg>
